[workspace]
resolver = "2"
members = ["crates/pizza-delivery-core", "crates/pizza-delivery"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EllianCarlos/pizza-delivery"
rust-version = "1.80"

[workspace.dependencies]
pizza-delivery-core = { path = "crates/pizza-delivery-core", version = "0.0.0" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
listenfd = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
ulid = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
