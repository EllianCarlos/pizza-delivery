name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Web typecheck, tests and build
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: TypeScript types are up to date
        run: |
          cargo test -p pizza-delivery-core --lib
          git diff --exit-code -- web/src/generated
          test -z "$(git ls-files --others --exclude-standard web/src/generated)"
